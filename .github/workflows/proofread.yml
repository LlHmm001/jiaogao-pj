name: Visual Proofreader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proofread:
    runs-on: ubuntu-latest

    services:
      paddleocr:
        image: paddlecloud/paddleocr:latest
        ports:
          - 8866:8866
        options: --health-cmd "curl -f http://localhost:8866/ocr/predict || exit 1" --health-interval 10s --health-timeout 5s --health-retries 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual proofreader
        run: npx tsx src/index.ts
        env:
          OCR_ENDPOINT: http://localhost:8866
          OCR_TIMEOUT: 30000
          BROWSER_TYPE: chromium

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-proofreader-report
          path: reports/

      - name: Check for visual issues
        id: check
        run: |
          ISSUES=$(jq '.summary.totalIssues' reports/report.json)
          ERRORS=$(jq '.summary.issuesBySeverity.error // 0' reports/report.json)
          echo "total_issues=$ISSUES" >> $GITHUB_OUTPUT
          echo "total_errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "::notice::Visual proofreader found $ISSUES issues ($ERRORS errors)"

      - name: Comment PR
        if: github.event_name == 'pull_request' && steps.check.outputs.total_issues != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = ${{ steps.check.outputs.total_issues }};
            const errors = ${{ steps.check.outputs.total_errors }};
            const runId = context.runId;
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Visual Proofreader Results\n\n- **${issues}** visual issues detected (${errors} errors)\n- 📊 [View full report](${url})`
            });
