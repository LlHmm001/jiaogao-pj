services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visual-proofreader
    ports:
      - "${PORT:-3100}:${PORT:-3100}"
    environment:
      - PORT=${PORT:-3100}
      - BROWSER_TYPE=${BROWSER_TYPE:-chromium}
    volumes:
      - ./config:/app/config:ro
      - ./examples:/app/examples:ro
      - screenshots_data:/app/screenshots
      - reports_data:/app/reports
    restart: unless-stopped

volumes:
  screenshots_data:
  reports_data:
